[package]
name = "apple-mail-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/furedea/apple-mail-cli"
description = "A safe JSON CLI for Apple Mail automation on macOS"

[package.metadata.cargo-machete]
ignored = ["serde"]

[[bin]]
name = "apple-mail"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
serde = "=1.0.228"
serde_derive = "=1.0.228"
serde_json = "1.0.150"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
