[package]
name = "apple-mail-cli"
version = "0.1.1"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/furedea/apple-mail-cli"
description = "A safe JSON CLI for Apple Mail automation on macOS"

[package.metadata.cargo-machete]
ignored = ["serde"]

[[bin]]
name = "apple-mail"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
serde = "=1.0.228"
serde_derive = "=1.0.228"
serde_json = "1.0.150"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
cognitive_complexity = "warn"
excessive_nesting = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.2"
# CI backends to support
ci = "github"
# This repository keeps a custom Release Please workflow and uses dist only for
# artifact and installer generation inside that workflow.
allow-dirty = ["ci"]
# The installers to generate for each app
installers = ["shell"]
# Mail automation needs Mail.app and /usr/bin/osascript, so only Apple Silicon
# macOS is a meaningful target.
targets = ["aarch64-apple-darwin"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
